# /etc/nginx/sites-available/complianceplus  (Certbot adds the 443 block and certificates)
server {
    listen 80;
    server_name complianceplus.uk www.complianceplus.uk;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets: serve straight from disk and cache for a year
    location /assets/ {
        root /var/www/complianceplus/current/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(favicon\.svg|og-image\.jpg|robots\.txt|sitemap\.xml)$ {
        root /var/www/complianceplus/current/public;
        expires 1d;
        try_files $uri =404;
    }

    # Everything else is rendered by the Node server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Add Strict-Transport-Security in the 443 block once HTTPS works.
}
